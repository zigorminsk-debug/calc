name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          chmod +x $HOME/android-sdk/cmdline-tools/latest/bin/*
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Verify SDK install
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_SDK_ROOT
          ls -la $ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /tmp
          cp -r /tmp/gradle-8.2 /home/runner/gradle-8.2
          echo "/home/runner/gradle-8.2/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=/home/runner/gradle-8.2" >> $GITHUB_ENV

      - name: Create local.properties with SDK path
        run: |
          echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/local.properties
          cat $GITHUB_WORKSPACE/local.properties

      - name: Network check to Maven Central
        run: |
          echo "=== Maven Central connectivity ==="
          curl -sI https://repo1.maven.org/maven2/ | head -5 || echo "curl failed"
          echo "=== Google Maven connectivity ==="
          curl -sI https://maven.google.com/ | head -5 || echo "curl failed"

      - name: Build debug APK
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH
          export PATH=/home/runner/gradle-8.2/bin:$PATH
          export GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home
          mkdir -p $GRADLE_USER_HOME
          LOG=$GITHUB_WORKSPACE/ci-diag.log
          GRADLE=/home/runner/gradle-8.2/bin/gradle
          {
            echo "=== DIAG $(date -u) ==="
            echo "cwd: $(pwd)"
            echo "repo root files:"
            ls -la
            echo "android sdk root: $ANDROID_SDK_ROOT"
            ls "$ANDROID_SDK_ROOT"
            echo "gradle binary: $(ls -la $GRADLE 2>&1 || echo MISSING)"
            echo "gradle version:"
            "$GRADLE" --version
            echo "=== gradle assembleDebug output ==="
          } > "$LOG"
          "$GRADLE" assembleDebug --no-daemon --stacktrace --info >> "$LOG" 2>&1
          GRADLE_EXIT=$?
          echo "GRADLE_EXIT=$GRADLE_EXIT" >> "$LOG"
          echo "=== post-build files ===" >> "$LOG"
          find app/build -name "*.apk" 2>&1 >> "$LOG" || echo "find failed"
          echo "=== tail of log ==="
          tail -n 500 "$LOG"
          echo "=== exit with gradle code ==="
          exit $GRADLE_EXIT

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ github.workspace }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ github.workspace }}/ci-diag.log
          retention-days: 7
